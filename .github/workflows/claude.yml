name: claude runs
# Reads every office's write-off policy with Claude (3 runs each), drafts the owner notes,
# re-scores the eval and rebuilds the demo page, then commits the results.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install anthropic
      - name: Read the policies
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m kit.policy --live --runs 3
      - name: Draft the owner notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m kit.notes --live
      - run: python -m eval.run_eval
      - run: python scripts/build_demo.py
      - run: python -m unittest
      - name: Commit results
        run: |
          git config user.name "Pranav Gudise"
          git config user.email "273664482+pg2342-hub@users.noreply.github.com"
          git add data eval/results docs
          git diff --cached --quiet || git commit -m "Refresh Claude runs, eval results and demo page"
          git push
